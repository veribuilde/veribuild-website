<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | VeriBuild International</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
--navy:#102A43;
--mustard:#E8B231;
--gray:#6B7280;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#102A43,#1c476f);
}

.signup-card{
width:100%;
max-width:650px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:2rem;
font-weight:800;
color:var(--navy);
margin-bottom:10px;
}

.logo .build{
color:var(--mustard);
}

.logo .international{
color:#000;
margin-left:8px;
}

.subtitle{
text-align:center;
color:var(--gray);
margin-bottom:30px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.input-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:var(--navy);
}

input,
select{
width:100%;
padding:14px;
border:2px solid #ddd;
border-radius:10px;
font-size:1rem;
}

input:focus,
select:focus{
outline:none;
border-color:var(--mustard);
}

.signup-btn{
width:100%;
padding:15px;
background:var(--mustard);
border:none;
border-radius:10px;
font-weight:700;
font-size:1rem;
cursor:pointer;
transition:.3s;
}

.signup-btn:hover{
transform:translateY(-2px);
}

.alert{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:20px;
}

.success{
background:#e8f5e9;
color:#2e7d32;
}

.error{
background:#ffebee;
color:#c62828;
}

.links{
margin-top:25px;
text-align:center;
}

.links a{
text-decoration:none;
color:var(--navy);
font-weight:600;
}

@media(max-width:768px){

.row{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="signup-card">

<div class="logo">
Veri<span class="build">Build</span>
<span class="international">International</span>
</div>

<p class="subtitle">
Join South Africa's Construction Trust Network
</p>

<div id="successMessage" class="alert success">
Account created successfully. Redirecting...
</div>

<div id="errorMessage" class="alert error">
Please complete all required fields.
</div>

<form id="signupForm">

<div class="row">

<div class="input-group">
<label>First Name</label>
<input type="text" id="firstName" required>
</div>

<div class="input-group">
<label>Last Name</label>
<input type="text" id="lastName" required>
</div>

</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="tel" id="phone" required>
</div>

<div class="input-group">
<label>Account Type</label>

<select id="role" required>

<option value="">
Select Role
</option>

<option value="homeowner">
Homeowner
</option>

<option value="contractor">
Contractor / Tasker
</option>

<option value="merchant">
Merchant
</option>

</select>

</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button type="submit" class="signup-btn">
Create Account
</button>

</form>

<div class="links">

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

<br>

<a href="index.html">
<i class="fa-solid fa-arrow-left"></i>
Back To Home
</a>

</div>

</div>

<script>

/* AUTO-SELECT ROLE FROM URL */

const params =
new URLSearchParams(
window.location.search
);

const roleParam =
params.get("role");

if(roleParam){

window.addEventListener(
"DOMContentLoaded",
() => {

document.getElementById(
"role"
).value = roleParam;

});

}

/* SIGNUP */

document
.getElementById("signupForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

const firstName =
document
.getElementById("firstName")
.value
.trim();

const lastName =
document
.getElementById("lastName")
.value
.trim();

const email =
document
.getElementById("email")
.value
.trim();

const phone =
document
.getElementById("phone")
.value
.trim();

const role =
document
.getElementById("role")
.value;

const password =
document
.getElementById("password")
.value;

const confirmPassword =
document
.getElementById("confirmPassword")
.value;

const success =
document.getElementById(
"successMessage"
);

const error =
document.getElementById(
"errorMessage"
);

/* VALIDATION */

if(
!firstName ||
!lastName ||
!email ||
!phone ||
!role ||
!password ||
!confirmPassword
){

error.innerHTML =
"Please complete all required fields.";

error.style.display =
"block";

success.style.display =
"none";

return;

}

/* PASSWORD CHECK */

if(
password !==
confirmPassword
){

error.innerHTML =
"Passwords do not match.";

error.style.display =
"block";

success.style.display =
"none";

return;

}

/* ADMIN PROTECTION */

if(
email.toLowerCase() ===
"amsdarl0w@gmail.com"
){

error.innerHTML =
"This account is reserved for system administration.";

error.style.display =
"block";

success.style.display =
"none";

return;

}

error.style.display =
"none";

/* BASE ACCOUNT */

let account = {

firstName:
firstName,

lastName:
lastName,

fullName:
`${firstName} ${lastName}`,

email:
email,

phone:
phone,

role:
role,

accountStatus:
"Active",

verificationStatus:
"Pending",

joinedDate:
new Date().toLocaleDateString()

};
/* HOMEOWNER */

if(
role ===
"homeowner"
){

account.accountType =
"Homeowner";

account.activeProjects =
0;

account.completedProjects =
0;

}

/* CONTRACTOR / TASKER */

else if(
role ===
"contractor"
){

account.accountType =
"Contractor";

account.contractorTier =
"Tier 1";

account.trustLevel =
1;

account.projectCap =
5000;

account.activeJobs =
0;

account.completedJobs =
0;

account.rating =
0;

account.verificationStatus =
"Pending";

}

/* MERCHANT */

else if(
role ===
"merchant"
){

account.accountType =
"Merchant";

account.activeOrders =
0;

account.completedOrders =
0;

account.verificationStatus =
"Verified";

}

/* SAVE */

localStorage.setItem(
"veribuildInternationalAccount",
JSON.stringify(account)
);

/* AUTO LOGIN OBJECT */

localStorage.setItem(
"veribuildInternationalUser",
JSON.stringify({

name:
account.fullName,

email:
account.email,

role:
account.role,

loggedIn:
true,

verificationStatus:
account.verificationStatus,

trustLevel:
account.trustLevel || 1

})
);

/* SUCCESS */

success.style.display =
"block";

setTimeout(() => {

if(
role ===
"homeowner"
){

window.location.href =
"homeowner-dashboard.html";

}

else if(
role ===
"contractor"
){

window.location.href =
"contractor-dashboard.html";

}

else if(
role ===
"merchant"
){

window.location.href =
"merchant-dashboard.html";

}

},1500);

});

</script>

</body>
</html>
