<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | VeriBuild</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
    --navy:#102A43;
    --mustard:#E8B231;
    --white:#ffffff;
    --light:#f5f7fa;
    --gray:#6b7280;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#102A43,#1f4a72);
    padding:20px;
}

.signup-card{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    font-size:2rem;
    font-weight:800;
    color:var(--navy);
    margin-bottom:10px;
}

.logo span{
    color:var(--mustard);
}

.subtitle{
    text-align:center;
    color:var(--gray);
    margin-bottom:30px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:var(--navy);
}

input, select{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:1rem;
}

input:focus,
select:focus{
    outline:none;
    border-color:var(--mustard);
}

.signup-btn{
    width:100%;
    border:none;
    background:var(--mustard);
    padding:15px;
    border-radius:10px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
}

.success{
    display:none;
    background:#e8f5e9;
    color:#2e7d32;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
}

.error{
    display:none;
    background:#ffebee;
    color:#c62828;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    text-decoration:none;
    color:var(--navy);
    font-weight:600;
}

@media(max-width:768px){

.row{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="signup-card">

<div class="logo">
Veri<span>Build</span>
</div>

<p class="subtitle">
Create Your VeriBuild Account
</p>

<div id="successMessage" class="success">
Account created successfully. Redirecting to login...
</div>

<div id="errorMessage" class="error">
Please complete all required fields.
</div>

<form id="signupForm">

<div class="row">

<div class="input-group">
<label>First Name</label>
<input type="text" id="firstName" required>
</div>

<div class="input-group">
<label>Last Name</label>
<input type="text" id="lastName" required>
</div>

</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="tel" id="phone" required>
</div>

<div class="input-group">
<label>Select Role</label>
<select id="role" required>
<option value="">Choose a Role</option>
<option value="homeowner">Homeowner</option>
<option value="contractor">Contractor</option>
<option value="merchant">Merchant</option>
<option value="admin">Admin</option>
</select>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button type="submit" class="signup-btn">
Create Account
</button>

</form>

<div class="links">
Already have an account?
<a href="login.html">Login</a>
<br><br>
<a href="index.html">
<i class="fa-solid fa-arrow-left"></i> Back Home
</a>
</div>

</div>
<script>

const params = new URLSearchParams(window.location.search);
const selectedRole = params.get("role");

if(selectedRole){
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("role").value = selectedRole;
    });
}

document
.getElementById("signupForm")
.addEventListener("submit", function(e){

e.preventDefault();

const firstName =
document.getElementById("firstName").value;

const lastName =
document.getElementById("lastName").value;

const email =
document.getElementById("email").value;

const phone =
document.getElementById("phone").value;

const role =
document.getElementById("role").value;

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const success =
document.getElementById("successMessage");

const error =
document.getElementById("errorMessage");

if(
!firstName ||
!lastName ||
!email ||
!phone ||
!role ||
!password ||
!confirmPassword
){
    error.innerText =
    "Please complete all required fields.";
    error.style.display = "block";
    return;
}

if(password !== confirmPassword){
    error.innerText =
    "Passwords do not match.";
    error.style.display = "block";
    return;
}

error.style.display = "none";

const account = {
    firstName,
    lastName,
    email,
    phone,
    role
};

localStorage.setItem(
    "veribuildAccount",
    JSON.stringify(account)
);

success.style.display = "block";

setTimeout(() => {
    window.location.href = "login.html";
}, 2000);

});

</script>

</body>
</html>
