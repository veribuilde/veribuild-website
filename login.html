<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | VeriBuild International</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
--navy:#102A43;
--mustard:#E8B231;
--light:#F5F7FA;
--gray:#6B7280;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#102A43,#1c476f);
padding:20px;
}

.login-card{
width:100%;
max-width:500px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:2rem;
font-weight:800;
color:var(--navy);
margin-bottom:10px;
}

.logo span{
color:var(--mustard);
}

/* FORCE "International" TO BE BLACK */
.logo .international{
color:#000;
}

.subtitle{
text-align:center;
color:var(--gray);
margin-bottom:30px;
}

.input-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:var(--navy);
}

input,
select{
width:100%;
padding:14px;
border:2px solid #ddd;
border-radius:10px;
font-size:1rem;
}

input:focus,
select:focus{
outline:none;
border-color:var(--mustard);
}

.login-btn{
width:100%;
padding:15px;
background:var(--mustard);
border:none;
border-radius:10px;
font-weight:700;
font-size:1rem;
cursor:pointer;
transition:.3s;
}

.login-btn:hover{
transform:translateY(-2px);
}

.alert{
display:none;
padding:12px;
margin-bottom:20px;
border-radius:10px;
}

.success{
background:#e8f5e9;
color:#2e7d32;
}

.error{
background:#ffebee;
color:#c62828;
}

.links{
margin-top:25px;
text-align:center;
}

.links a{
text-decoration:none;
color:var(--navy);
font-weight:600;
}

</style>
</head>

<body>

<div class="login-card">

<!-- LOGO UPDATED -->
<div class="logo">
Veri<span>Build</span> <span class="international">International</span>
</div>

<p class="subtitle">
Access South Africa's Construction Trust Network
</p>

<div id="successMessage" class="alert success">
Login successful. Redirecting to your dashboard...
</div>

<div id="errorMessage" class="alert error">
Please complete all required fields.
</div>

<form id="loginForm">

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="input-group">
<label>Account Type</label>
<select id="role" required>

<option value="">
Select Role
</option>

<option value="homeowner">
Homeowner
</option>

<option value="contractor">
Contractor / Tasker
</option>

<option value="merchant">
Merchant
</option>

</select>
</div>

<button type="submit" class="login-btn">
Login
</button>

</form>
<div class="links">

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

<br>

<a href="index.html">
<i class="fa-solid fa-arrow-left"></i>
Back To Home
</a>

</div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value
.trim();

let role =
document
.getElementById("role")
.value;

const success =
document
.getElementById("successMessage");

const error =
document
.getElementById("errorMessage");

if(
!email ||
!password ||
!role
){

error.style.display =
"block";

success.style.display =
"none";

return;

}

error.style.display =
"none";

/* ADMIN OVERRIDE */

if(
email.toLowerCase() ===
"amsdarl0w@gmail.com"
){

role = "admin";

}

/* USER NAME */

const userName =
email.split("@")[0];

/* DEFAULT USER OBJECT */

let user = {

name:
userName,

email:
email,

role:
role,

loggedIn:
true,

verificationStatus:
"Pending",

trustLevel:
1,

accountStatus:
"Active"

};

/* HOMEOWNER */

if(role === "homeowner"){

user.accountType =
"Homeowner";

}

/* CONTRACTOR / TASKER */

else if(role === "contractor"){

user.accountType =
"Contractor";

user.contractorTier =
"Tier 1";

user.trustLevel =
1;

user.projectCap =
5000;

user.verificationStatus =
"Pending";

}

/* MERCHANT */

else if(role === "merchant"){

user.accountType =
"Merchant";

user.verificationStatus =
"Verified";

}

/* ADMIN */

else if(role === "admin"){

user.accountType =
"Administrator";

user.verificationStatus =
"Verified";

user.trustLevel =
999;

}

/* SAVE USER */

localStorage.setItem(
"veribuildUser",
JSON.stringify(user)
);

success.style.display =
"block";

/* REDIRECT */

setTimeout(() => {

if(role === "homeowner"){

window.location.href =
"homeowner-dashboard.html";

}

else if(role === "contractor"){

window.location.href =
"contractor-dashboard.html";

}

else if(role === "merchant"){

window.location.href =
"merchant-dashboard.html";

}

else if(role === "admin"){

window.location.href =
"admin-dashboard.html";

}

},1500);

});

</script>

</body>
</html>
