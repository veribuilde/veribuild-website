<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | VeriBuild</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
min-height:100vh;
}

header{
background:#0A2342;
padding:20px;
text-align:center;
}

header h1{
color:white;
}

header span{
color:#D4A017;
}

.container{
max-width:500px;
margin:60px auto;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#0A2342;
margin-bottom:20px;
}

input,
select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:14px;
background:#D4A017;
border:none;
border-radius:6px;
font-weight:bold;
color:#0A2342;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.link{
text-align:center;
margin-top:20px;
}

.link a{
color:#0A2342;
font-weight:bold;
text-decoration:none;
}

.notice{
background:#f8f8f8;
padding:10px;
border-radius:6px;
margin-bottom:15px;
font-size:14px;
color:#666;
}

</style>
</head>

<body>

<header>
<h1>Veri<span>Build</span></h1>
</header>

<div class="container">

<h2>Login</h2>

<div class="notice">
Login to access your VeriBuild account.
</div>

<input
type="email"
id="email"
placeholder="Email Address"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<select id="role" required>
<option value="">Select Account Type</option>
<option value="homeowner">Homeowner</option>
<option value="contractor">Contractor</option>
<option value="supplier">Supplier</option>
</select>

<button onclick="login()">
Login
</button>

<div class="link">
<p>
No account?
<a href="signup.html">Create one</a>
</p>
</div>

</div>

<script>

function login(){

let email =
document.getElementById("email")
.value
.toLowerCase()
.trim();

let password =
document.getElementById("password")
.value;

let role =
document.getElementById("role")
.value;

// Validation

if(!email || !password || !role){

alert("Please fill in all fields.");
return;

}

// Admin emails

const adminEmails = [

"amsdarl0w@gmail.com"

];

// Get saved account

let savedEmail =
localStorage.getItem("email");

let savedPassword =
localStorage.getItem("password");

let savedName =
localStorage.getItem("name");

// Check account exists

if(email !== savedEmail){

alert("User not found. Please sign up first.");
return;

}

// Check password

if(password !== savedPassword){

alert("Incorrect password.");
return;

}

// Save session

localStorage.setItem(
"email",
savedEmail
);

localStorage.setItem(
"name",
savedName
);

// ADMIN LOGIN

if(adminEmails.includes(email)){

localStorage.setItem(
"role",
"admin"
);

window.location.href =
"admin-dashboard.html";

return;

}

// HOMEOWNER

if(role === "homeowner"){

localStorage.setItem(
"role",
"homeowner"
);

window.location.href =
"homeowner-dashboard.html";

return;

}

// CONTRACTOR

if(role === "contractor"){

localStorage.setItem(
"role",
"contractor"
);

window.location.href =
"contractor-dashboard.html";

return;

}

// SUPPLIER

if(role === "supplier"){

localStorage.setItem(
"role",
"supplier"
);

window.location.href =
"supplier-dashboard.html";

return;

}

}

</script>

</body>
</html>
