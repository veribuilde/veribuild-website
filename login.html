<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | VeriBuild</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    min-height:100vh;
}

header{
    background:#0A2342;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#D4A017;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

nav a:hover{
    color:#D4A017;
}

.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:80px 20px;
}

.login-card{
    background:white;
    width:100%;
    max-width:500px;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.login-card h1{
    text-align:center;
    color:#0A2342;
    margin-bottom:10px;
}

.login-card p{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
}

.login-btn{
    width:100%;
    background:#D4A017;
    color:#0A2342;
    border:none;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

.login-btn:hover{
    opacity:0.9;
}

.links{
    text-align:center;
    margin-top:25px;
}

.links a{
    color:#0A2342;
    text-decoration:none;
    font-weight:bold;
}

.links p{
    margin-top:10px;
}

footer{
    background:#081A33;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

@media(max-width:768px){

header{
    flex-direction:column;
}

nav{
    margin-top:15px;
}

nav a{
    display:block;
    margin:8px 0;
    text-align:center;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Veri<span>Build</span>
</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="how-it-works.html">How It Works</a>
<a href="post-project.html">Post Project</a>
<a href="contractor-signup.html">Join as Contractor</a>
</nav>

</header>

<div class="login-container">

<div class="login-card">

<h1>Welcome Back</h1>

<p>Log in to access your VeriBuild dashboard.</p>

<form onsubmit="loginUser(event)">

<div class="form-group">
<label>Email Address</label>
<input type="email" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" required>
</div>

<div class="form-group">
<label>Account Type</label>

<select id="accountType" required>

<option value="">Select Account Type</option>

<option value="homeowner">
Homeowner
</option>

<option value="contractor">
Contractor
</option>

<option value="supplier">
Supplier
</option>

<option value="admin">
Admin
</option>

</select>

</div>

<button type="submit" class="login-btn">
Log In
</button>

</form>

<div class="links">

<p>
<a href="#">Forgot Password?</a>
</p>

<p>
Homeowner?
<a href="post-project.html">
Post a Project
</a>
</p>

<p>
Contractor?
<a href="contractor-signup.html">
Create Account
</a>
</p>

</div>

</div>

</div>

<footer>

<p>© 2026 VeriBuild. All Rights Reserved.</p>

</footer>

<script>

function loginUser(event){

event.preventDefault();

let role =
document.getElementById("accountType").value;

if(role === "homeowner"){

window.location.href =
"homeowner-dashboard.html";

}

else if(role === "contractor"){

window.location.href =
"contractor-dashboard.html";

}

else if(role === "supplier"){

window.location.href =
"supplier-dashboard.html";

}

else if(role === "admin"){

window.location.href =
"admin-dashboard.html";

}

else{

alert(
"Please select an account type."
);

}

}

</script>

</body>
</html>
