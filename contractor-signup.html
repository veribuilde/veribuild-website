<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contractor Registration | VeriBuild</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
--navy:#102A43;
--mustard:#E8B231;
--light:#F5F7FA;
--gray:#6B7280;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:linear-gradient(135deg,#102A43,#1c476f);
padding:30px;
}

.form-container{
max-width:900px;
margin:auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.logo{
text-align:center;
font-size:2rem;
font-weight:800;
color:var(--navy);
margin-bottom:10px;
}

.logo span{
color:var(--mustard);
}

.subtitle{
text-align:center;
color:var(--gray);
margin-bottom:30px;
}

.section-title{
margin:30px 0 15px;
color:var(--navy);
font-size:1.2rem;
font-weight:700;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:var(--navy);
}

input,
select,
textarea{
width:100%;
padding:14px;
border:2px solid #ddd;
border-radius:10px;
font-size:1rem;
}

textarea{
resize:vertical;
min-height:120px;
}

.checkbox{
display:flex;
align-items:flex-start;
gap:12px;
margin-top:20px;
}

.checkbox input{
width:auto;
margin-top:5px;
}

.submit-btn{
width:100%;
padding:15px;
border:none;
background:var(--mustard);
border-radius:10px;
font-size:1rem;
font-weight:700;
cursor:pointer;
margin-top:20px;
}

.alert{
display:none;
padding:12px;
border-radius:10px;
margin-bottom:20px;
}

.success{
background:#e8f5e9;
color:#2e7d32;
}

.error{
background:#ffebee;
color:#c62828;
}

@media(max-width:768px){

.row{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="form-container">

<div class="logo">
Veri<span>Build</span>
</div>

<p class="subtitle">
Contractor Registration & Verification Application
</p>

<div id="successMessage" class="alert success">
Application submitted successfully.
</div>

<div id="errorMessage" class="alert error">
Please complete all required fields.
</div>

<form id="contractorForm">

<div class="section-title">
Personal Information
</div>

<div class="row">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="fullName" required>
</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

</div>

<div class="row">

<div class="input-group">
<label>Phone Number</label>
<input type="tel" id="phone" required>
</div>

<div class="input-group">
<label>ID Number</label>
<input type="text" id="idNumber" required>
</div>

</div>

<div class="section-title">
Business Information
</div>

<div class="row">

<div class="input-group">
<label>Company Name</label>
<input type="text" id="company">
</div>

<div class="input-group">
<label>Trade / Specialisation</label>
<select id="trade" required>
<option value="">Select Trade</option>
<option>General Building</option>
<option>Plumbing</option>
<option>Electrical</option>
<option>Roofing</option>
<option>Tiling</option>
<option>Painting</option>
<option>Carpentry</option>
<option>Other</option>
</select>
</div>

</div>

<div class="row">

<div class="input-group">
<label>Years Of Experience</label>
<input type="number" id="experience" required>
</div>

<div class="input-group">
<label>Service Area</label>
<input type="text" id="serviceArea" placeholder="e.g. Johannesburg, Pretoria">
</div>

</div>

<div class="input-group">
<label>CIPC Registration Number (Optional)</label>
<input type="text" id="cipc">
</div>

<div class="input-group">
<label>NHBRC Registration Number (If Applicable)</label>
<input type="text" id="nhbrc">
</div>

<div class="input-group">
<label>Business Description</label>
<textarea id="description"></textarea>
</div>

<div class="section-title">
Document Uploads
</div>

<div class="input-group">
<label>Upload South African ID</label>
<input type="file" id="idUpload">
</div>

<div class="input-group">
<label>Upload Supporting Documents</label>
<input type="file" id="docsUpload" multiple>
</div>

<div class="checkbox">
<input type="checkbox" id="popiaConsent">
<label for="popiaConsent">
I acknowledge that VeriBuild will collect, process and store my personal information and supporting documents for contractor verification, compliance and platform operations in accordance with South Africa's Protection of Personal Information Act (POPIA).
</label>
</div>

<button type="submit" class="submit-btn">
Submit Application
</button>

</form>
<script>

document
.getElementById("contractorForm")
.addEventListener("submit", function(e){

e.preventDefault();

const fullName =
document.getElementById("fullName").value;

const email =
document.getElementById("email").value;

const phone =
document.getElementById("phone").value;

const idNumber =
document.getElementById("idNumber").value;

const trade =
document.getElementById("trade").value;

const experience =
document.getElementById("experience").value;

const popiaConsent =
document.getElementById("popiaConsent").checked;

const success =
document.getElementById("successMessage");

const error =
document.getElementById("errorMessage");

if(
!fullName ||
!email ||
!phone ||
!idNumber ||
!trade ||
!experience
){

error.innerHTML =
"Please complete all required fields.";

error.style.display = "block";

return;

}

if(!popiaConsent){

error.innerHTML =
"You must accept the POPIA notice before submitting your application.";

error.style.display = "block";

return;

}

error.style.display = "none";

const contractorApplication = {

fullName:
document.getElementById("fullName").value,

email:
document.getElementById("email").value,

phone:
document.getElementById("phone").value,

idNumber:
document.getElementById("idNumber").value,

company:
document.getElementById("company").value,

trade:
document.getElementById("trade").value,

experience:
document.getElementById("experience").value,

serviceArea:
document.getElementById("serviceArea").value,

cipc:
document.getElementById("cipc").value,

nhbrc:
document.getElementById("nhbrc").value,

description:
document.getElementById("description").value,

status:"Pending Verification",

submitted:
new Date().toLocaleDateString()

};

localStorage.setItem(
"contractorApplication",
JSON.stringify(contractorApplication)
);

success.style.display = "block";

setTimeout(() => {

window.location.href = "login.html";

}, 2500);

});

</script>

</div>

</body>
</html>
